<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebFacer · 可视化 CSS 制作</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app" data-theme="dark">

    <!-- ===== Top area: app bar + mode tabs + ribbon ===== -->
    <div id="top">
      <header class="appbar">
        <div class="appbar-brand">
          <span class="brand-logo">◧</span>
          <span class="brand-name">WebFacer</span>
        </div>
        <input type="text" id="project-name" class="appbar-name" spellcheck="false" placeholder="未命名项目" title="项目名称">
        <div class="appbar-spacer"></div>
        <div class="appbar-zoom">
          <button class="btn btn-icon" id="zoom-out" title="缩小">−</button>
          <button class="btn btn-zoom" id="zoom-level" title="重置缩放">100%</button>
          <button class="btn btn-icon" id="zoom-in" title="放大">+</button>
        </div>
        <button class="btn" id="btn-code" title="源码预览">代码</button>
        <button class="btn" id="btn-save" title="保存到浏览器本地">保存</button>
        <span id="export-target" class="export-target" hidden title="导出的目标文件夹"></span>
        <button class="btn btn-primary" id="btn-export" title="导出到所选文件夹">导出 ▾</button>
      </header>
      <nav class="modes" id="modes" role="tablist" aria-label="工作模式"></nav>
      <div class="ribbon" id="ribbon"></div>
    </div>

    <!-- ===== Workbench ===== -->
    <div class="workbench" id="workbench">

      <!-- Left panel -->
      <aside class="panel panel-left" id="left-panel">
        <div class="panel-tabs" id="left-tabs">
          <button class="panel-tab active" data-tab="library">组件</button>
          <button class="panel-tab" data-tab="layers">图层</button>
        </div>
        <div class="panel-body" id="left-body">
          <!-- library / layers rendered by JS -->
        </div>
      </aside>

      <!-- Canvas area -->
      <main class="canvas-area" id="canvas-area">
        <div class="canvas-stage" id="canvas-stage" tabindex="0"></div>
        <div class="start-panel" id="start-panel" hidden>
          <h2>构思 · 创建项目</h2>
          <label class="field">
            <span>项目名称</span>
            <input type="text" id="new-name" value="我的设计" spellcheck="false">
          </label>
          <label class="field">
            <span>画布尺寸</span>
            <div class="field-row">
              <input type="number" id="new-width" value="1200" min="200" max="8000" step="10" class="num"> ×
              <input type="number" id="new-height" value="800" min="200" max="8000" step="10" class="num">
            </div>
          </label>
          <div class="field folder-field">
            <span>导出文件夹 <em>(可选)</em></span>
            <div class="field-row">
              <input type="text" id="new-folder" class="ctl" readonly placeholder="未选择（导出时再选）" title="导出的目标文件夹">
              <button class="btn btn-outlined btn-sm" id="new-folder-pick" title="选择导出文件夹">选择文件夹…</button>
              <button class="btn btn-ghost btn-sm" id="new-folder-clear" title="清除" hidden>清除</button>
            </div>
          </div>
          <div class="sp-actions">
            <button class="btn btn-primary" id="new-create">创建项目</button>
            <button class="btn btn-tonal" id="new-demo">载入示例内容</button>
            <button class="btn btn-ghost" id="new-cancel">取消</button>
          </div>
        </div>
      </main>

      <!-- Right inspector -->
      <aside class="panel panel-right" id="right-panel">
        <div class="panel-body inspector" id="inspector">
          <!-- generated by JS -->
        </div>
      </aside>
    </div>

    <!-- ===== Logic graph + Timeline panel (independent) ===== -->
    <section class="logic-panel" id="logic-panel" hidden>
      <div class="lp-resize" id="lp-resize" title="拖动调整高度"></div>
      <header class="lp-head">
        <span class="lp-title">逻辑 · 动画</span>
        <span class="lp-subtitle">点逻辑图节点编辑其关键帧动画；选中画布元素也会跟随</span>
        <div class="lp-head-actions">
          <button class="btn btn-ghost btn-sm" id="lp-close" title="收起">收起 ×</button>
        </div>
      </header>
      <div class="lp-body">
        <div class="lp-logic" id="lp-logic"></div>
        <div class="lp-timeline" id="lp-timeline">
          <div class="tl-master" id="tl-master"></div>
          <div class="tl-detail" id="tl-detail"></div>
        </div>
      </div>
    </section>

    <!-- ===== Code Preview dock ===== -->
    <section class="code-preview" id="code-preview" hidden>
      <header class="code-preview-head">
        <div class="cp-tabs" id="cp-tabs">
          <button class="cp-tab active" data-tab="css">当前元素</button>
          <button class="cp-tab" data-tab="all">整页 CSS</button>
          <button class="cp-tab" data-tab="html">HTML</button>
        </div>
        <div class="cp-actions">
          <button class="btn btn-ghost btn-sm" id="cp-copy">复制</button>
          <button class="btn btn-ghost btn-sm" id="cp-close">关闭 ×</button>
        </div>
      </header>
      <div class="code-preview-body">
        <pre class="code-view"><code id="cp-code"></code></pre>
      </div>
    </section>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="js/bundle.js"></script>
</body>
</html>
